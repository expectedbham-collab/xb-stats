name: xB Stats Scraper

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

# never let two scrapes run (and push) at the same time
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests playwright beautifulsoup4

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run Opta stats scraper
        run: python scraper.py

      - name: Run SoccerStats halftime scraper
        run: python scraper_halftime.py || echo "Halftime scraper failed - continuing"

      - name: Build home/away venue split
        run: python venue_split.py || echo "Venue split failed - continuing"

      - name: Check if data changed
        id: changed
        run: |
          if [ -f /tmp/xb_no_change ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name  "xB Stats Bot"
          git config user.email "expectedbirmingham@gmail.com"
          git add data/history.json data/halftime.json data/venue.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: stats snapshot $(date -u +%Y-%m-%d)"
          # Rebase onto anything pushed while the scrape ran, then push. If the
          # rebase conflicts, fail the job so the snapshot is not lost silently.
          for attempt in 1 2 3; do
            if git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not push the snapshot after 3 attempts" && exit 1
